name: Check Playoff Scoring

# Verifies the site's playoff scoring still works against ESPN (see
# scripts/check-playoff-scoring.mjs). A failed run emails the repo owner; the
# run summary shows each player's playoff points once the playoffs start.
on:
  schedule:
    # Weekly (Mondays) outside the playoffs: catch ESPN API changes early
    - cron: '0 12 * 1-3,7-12 1'
    # Daily during the playoffs (April–June)
    - cron: '0 12 * 4-6 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # runs src/api.js (ES module syntax) without a build step

      - name: Check playoff scoring against ESPN
        run: node scripts/check-playoff-scoring.mjs
