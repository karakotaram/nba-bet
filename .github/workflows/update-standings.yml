name: Update Daily Standings

on:
  # Runs daily through the regular season. Once the playoffs start, the script
  # freezes the final regular-season standings and this workflow disables
  # itself. Re-enable it next season (Actions tab → "Enable workflow", or
  # `gh workflow enable update-standings.yml`) after archiving the season — see
  # README "Re-enabling for next season".
  schedule:
    # Run at 10am UTC (5am ET / 2am PT) - after all NBA games have finished
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write # trigger the site deploy, and disable this workflow at season end

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # runs src/api.js (ES module syntax) without a build step

      - name: Fetch and update standings
        id: standings
        run: node scripts/update-standings.mjs

      - name: Commit and push
        id: commit
        env:
          COMMIT_MESSAGE: ${{ steps.standings.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/historicStandings.js
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "${COMMIT_MESSAGE:-Update daily standings}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the
      # GitHub Pages deploy explicitly.
      - name: Deploy site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Turn off daily updates (regular season is over)
        if: steps.standings.outputs.season_over == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable update-standings.yml --repo "$GITHUB_REPOSITORY"
